name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --upgrade pip
      - run: pip install black ruff pytest
      - run: black --check .
      - run: ruff check .
      - run: pytest -q
      - run: python test/test_md2html.py
